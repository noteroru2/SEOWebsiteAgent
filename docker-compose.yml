services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seo_agent
      POSTGRES_USER: seo_agent
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - '55432:5432'
    volumes:
      - seo_agent_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seo_agent -d seo_agent']
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 512M }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://seo_agent:local_only_change_me@postgres:5432/seo_agent
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/google/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    ports:
      - '3000:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 512M }
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://seo_agent:local_only_change_me@postgres:5432/seo_agent
      WORKER_ID: worker-compose-1
      HEAVY_JOB_CONCURRENCY: 1
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/google/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', 'dist/healthcheck.js']
      interval: 15s
      timeout: 5s
      retries: 4
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 256M }
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: postgresql://seo_agent:local_only_change_me@postgres:5432/seo_agent
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }
volumes:
  seo_agent_db:
