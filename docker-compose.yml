services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seo_agent
      POSTGRES_USER: seo_agent
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - '55432:5432'
    volumes:
      - seo_agent_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seo_agent -d seo_agent']
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 512M }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://seo_agent:local_only_change_me@postgres:5432/seo_agent
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/google/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_GLOBAL_MONTHLY_BUDGET_USD: ${AI_GLOBAL_MONTHLY_BUDGET_USD:-28.50}
      AI_SITE_MONTHLY_BUDGET_USD: ${AI_SITE_MONTHLY_BUDGET_USD:-8.50}
    ports:
      - '3000:3000'
    volumes:
      - serp_artifacts:/app/artifacts/serp:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 512M }
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://seo_agent:local_only_change_me@postgres:5432/seo_agent
      WORKER_ID: worker-compose-1
      HEAVY_JOB_CONCURRENCY: 1
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/google/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_DEFAULT: ${OPENAI_MODEL_DEFAULT:-gpt-5.6-terra}
      OPENAI_MODEL_EFFICIENT: ${OPENAI_MODEL_EFFICIENT:-gpt-5.6-luna}
      OPENAI_MODEL_ESCALATION: ${OPENAI_MODEL_ESCALATION:-gpt-5.6-sol}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      SOURCE_REPO_ALLOWED_ROOTS: /source-repos
      SOURCE_REPO_LOGICAL_ROOT: ${SOURCE_REPO_HOST_ROOT:?SOURCE_REPO_HOST_ROOT is required for the worker}
      SOURCE_REPO_WORKER_ROOT: /source-repos
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      AI_GLOBAL_MONTHLY_BUDGET_USD: ${AI_GLOBAL_MONTHLY_BUDGET_USD:-28.50}
      AI_SITE_MONTHLY_BUDGET_USD: ${AI_SITE_MONTHLY_BUDGET_USD:-8.50}
      AI_MAX_ANALYSIS_COST_USD: ${AI_MAX_ANALYSIS_COST_USD:-0.25}
      AI_PRICE_LUNA_INPUT_USD_PER_MILLION: ${AI_PRICE_LUNA_INPUT_USD_PER_MILLION:-1}
      AI_PRICE_LUNA_CACHED_INPUT_USD_PER_MILLION: ${AI_PRICE_LUNA_CACHED_INPUT_USD_PER_MILLION:-0.1}
      AI_PRICE_LUNA_OUTPUT_USD_PER_MILLION: ${AI_PRICE_LUNA_OUTPUT_USD_PER_MILLION:-6}
      AI_PRICE_TERRA_INPUT_USD_PER_MILLION: ${AI_PRICE_TERRA_INPUT_USD_PER_MILLION:-2.5}
      AI_PRICE_TERRA_CACHED_INPUT_USD_PER_MILLION: ${AI_PRICE_TERRA_CACHED_INPUT_USD_PER_MILLION:-0.25}
      AI_PRICE_TERRA_OUTPUT_USD_PER_MILLION: ${AI_PRICE_TERRA_OUTPUT_USD_PER_MILLION:-15}
      AI_PRICE_SOL_INPUT_USD_PER_MILLION: ${AI_PRICE_SOL_INPUT_USD_PER_MILLION:-5}
      AI_PRICE_SOL_CACHED_INPUT_USD_PER_MILLION: ${AI_PRICE_SOL_CACHED_INPUT_USD_PER_MILLION:-0.5}
      AI_PRICE_SOL_OUTPUT_USD_PER_MILLION: ${AI_PRICE_SOL_OUTPUT_USD_PER_MILLION:-30}
      SEO_RECOMMENDATION_LOCALE: ${SEO_RECOMMENDATION_LOCALE:-}
      SERP_ARTIFACT_ROOT: /app/artifacts/serp
      PLAYWRIGHT_CHROMIUM_PATH: /usr/bin/chromium-browser
    volumes:
      - type: bind
        source: ${SOURCE_REPO_HOST_ROOT:?SOURCE_REPO_HOST_ROOT is required for the worker}
        target: /source-repos
        read_only: true
      - type: volume
        source: serp_artifacts
        target: /app/artifacts/serp
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', 'dist/healthcheck.js']
      interval: 15s
      timeout: 5s
      retries: 4
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 768M }
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: postgresql://seo_agent:local_only_change_me@postgres:5432/seo_agent
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }
volumes:
  seo_agent_db:
  serp_artifacts:
